<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Name — 3D & Motion Designer</title>
<meta name="description" content="3D & Motion Design portfolio">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0d; --bg2:#121215; --fg:#f2f2ee; --muted:#8b8b93; --line:#24242a;
    --accent:#c8ff3d; --radius:18px; --pad:clamp(16px,4vw,56px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--fg);font-family:Manrope,system-ui,sans-serif;font-size:17px;line-height:1.6;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  h1,h2,h3{font-family:Unbounded,sans-serif;font-weight:600;line-height:1.05;letter-spacing:-.02em}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

  /* NAV */
  .nav{position:fixed;inset:0 0 auto;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:18px var(--pad);mix-blend-mode:difference}
  .logo{font-family:Unbounded;font-weight:800;font-size:15px;letter-spacing:.02em}
  .nav nav{display:flex;gap:clamp(14px,3vw,32px);font-size:14px}
  .nav nav a{opacity:.8;transition:opacity .2s}
  .nav nav a:hover{opacity:1}

  /* HERO */
  .hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;padding:120px var(--pad) clamp(48px,8vw,96px);overflow:hidden}
  .hero-bg{position:absolute;inset:0;z-index:0}
  .hero-bg video{width:100%;height:100%;object-fit:cover;opacity:.55}
  .hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,13,.2) 0%,rgba(11,11,13,.35) 50%,var(--bg) 100%)}
  .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:float 14s ease-in-out infinite alternate}
  .b1{width:46vw;height:46vw;background:#5b3cff;top:-10%;left:-8%}
  .b2{width:38vw;height:38vw;background:#00c2ff;top:20%;right:-10%;animation-delay:-4s}
  .b3{width:30vw;height:30vw;background:var(--accent);bottom:-5%;left:35%;opacity:.25;animation-delay:-8s}
  @keyframes float{to{transform:translate(6vw,4vh) scale(1.15)}}
  .hero-inner{position:relative;z-index:1;max-width:1200px}
  .eyebrow{font-size:13px;text-transform:uppercase;letter-spacing:.18em;color:var(--muted);margin-bottom:18px}
  .hero h1{font-size:clamp(44px,10vw,148px);font-weight:800;margin-bottom:20px}
  .hero-role{font-size:clamp(18px,2.2vw,26px);color:#cfcfd4;max-width:640px;margin-bottom:36px}
  .play-btn{display:inline-flex;align-items:center;gap:14px;padding:14px 26px 14px 14px;border-radius:999px;background:var(--fg);color:var(--bg);font-weight:700;transition:transform .25s,background .25s}
  .play-btn:hover{transform:scale(1.04);background:var(--accent)}
  .play-ico{width:38px;height:38px;border-radius:50%;background:var(--bg);position:relative;flex:none}
  .play-ico::after{content:"";position:absolute;left:15px;top:12px;border-left:12px solid var(--fg);border-top:7px solid transparent;border-bottom:7px solid transparent}
  .scroll-cue{position:absolute;right:var(--pad);bottom:clamp(48px,8vw,96px);z-index:1;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);writing-mode:vertical-rl}

  /* WORK */
  section{padding:clamp(64px,10vw,140px) var(--pad)}
  .section-head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:20px;margin-bottom:40px}
  h2{font-size:clamp(32px,5vw,64px)}
  .filters{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:8px 16px;border:1px solid var(--line);border-radius:999px;font-size:14px;color:var(--muted);transition:all .2s}
  .chip:hover{color:var(--fg);border-color:#444}
  .chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(14px,2vw,28px)}
  .card{cursor:pointer}
  .card.wide{grid-column:span 2}
  .card.hide{display:none}
  .media{position:relative;aspect-ratio:16/10;border-radius:var(--radius);overflow:hidden;background:var(--bg2)}
  .card.wide .media{aspect-ratio:21/9}
  .media img,.media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.2,.7,.2,1),opacity .4s}
  .media video{opacity:0}
  .card.playing .media video{opacity:1}
  .card:hover .media img,.card:hover .media video{transform:scale(1.04)}
  .media.ph{background:
      radial-gradient(circle at 25% 30%,hsl(var(--h) 90% 60% / .9),transparent 50%),
      radial-gradient(circle at 75% 70%,hsl(calc(var(--h) + 70) 90% 55% / .8),transparent 50%),
      #141418;background-size:180% 180%;animation:drift 12s ease-in-out infinite alternate}
  @keyframes drift{to{background-position:100% 100%}}
  .num{position:absolute;left:22px;bottom:14px;font-family:Unbounded;font-weight:800;font-size:clamp(48px,8vw,110px);line-height:1;color:rgba(255,255,255,.9);mix-blend-mode:overlay}
  .play-mini{position:absolute;top:16px;right:16px;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.14);backdrop-filter:blur(10px);opacity:0;transform:scale(.8);transition:all .3s}
  .play-mini::after{content:"";position:absolute;left:18px;top:15px;border-left:12px solid #fff;border-top:8px solid transparent;border-bottom:8px solid transparent}
  .card:hover .play-mini{opacity:1;transform:scale(1)}
  .meta{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:16px 4px 0}
  .meta h3{font-size:clamp(16px,1.6vw,20px);font-weight:600}
  .meta span{font-size:14px;color:var(--muted);white-space:nowrap}

  /* ABOUT */
  .about{border-top:1px solid var(--line)}
  .about-cols{display:grid;grid-template-columns:1.4fr 1fr;gap:clamp(32px,6vw,96px);margin-top:40px}
  .about-text{font-size:clamp(20px,2.2vw,28px);line-height:1.45;color:#dcdce0}
  .about h3{font-family:Manrope;font-size:13px;text-transform:uppercase;letter-spacing:.18em;color:var(--muted);margin:0 0 14px;font-weight:700}
  .about ul{list-style:none;margin-bottom:36px}
  .about li{padding:10px 0;border-bottom:1px solid var(--line)}
  .tags{display:flex;flex-wrap:wrap;gap:8px}
  .tags li{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px}

  /* CONTACT */
  .contact{border-top:1px solid var(--line);text-align:left}
  .mail{display:inline-block;font-family:Unbounded;font-weight:800;font-size:clamp(28px,7vw,104px);line-height:1.05;letter-spacing:-.03em;word-break:break-all;background:linear-gradient(90deg,var(--fg) 50%,var(--accent) 50%) right/200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;transition:background-position .6s}
  .mail:hover{background-position:left}
  .socials{display:flex;flex-wrap:wrap;gap:12px 28px;margin-top:40px}
  .socials a{color:var(--muted);border-bottom:1px solid transparent;transition:all .2s}
  .socials a:hover{color:var(--fg);border-color:var(--fg)}
  footer{padding:28px var(--pad);border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

  /* MODAL */
  .modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:var(--pad);background:rgba(5,5,7,.85);backdrop-filter:blur(14px);opacity:0;pointer-events:none;transition:opacity .3s}
  .modal.open{opacity:1;pointer-events:auto}
  .modal-box{width:min(1200px,100%);transform:translateY(20px);transition:transform .35s}
  .modal.open .modal-box{transform:none}
  .player{position:relative;aspect-ratio:16/9;border-radius:var(--radius);overflow:hidden;background:#000}
  .player iframe,.player video{position:absolute;inset:0;width:100%;height:100%;border:0}
  .player .empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);text-align:center;padding:20px}
  .modal-info{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;padding-top:20px}
  .modal-info h3{font-size:clamp(20px,2.4vw,30px)}
  .modal-info p{color:#bdbdc3;max-width:620px;margin-top:8px}
  .modal-info dl{display:grid;grid-template-columns:auto auto;gap:4px 18px;font-size:14px;align-content:start}
  .modal-info dt{color:var(--muted)}
  .close{position:fixed;top:16px;right:16px;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.1);font-size:26px;line-height:1}
  .close:hover{background:rgba(255,255,255,.2)}

  /* REVEAL */
  .reveal{opacity:0;transform:translateY(30px);transition:opacity .8s,transform .8s cubic-bezier(.2,.7,.2,1)}
  .reveal.in{opacity:1;transform:none}

  @media (max-width:760px){
    .grid{grid-template-columns:1fr}
    .card.wide{grid-column:auto}
    .card.wide .media{aspect-ratio:16/10}
    .about-cols{grid-template-columns:1fr}
    .scroll-cue{display:none}
    .nav nav{gap:14px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="nav">
  <a class="logo" href="#top" id="logo"></a>
  <nav><a href="#work">Work</a><a href="#about">About</a><a href="#contact">Contact</a></nav>
</header>

<section class="hero" id="top">
  <div class="hero-bg" id="heroBg"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>
  <div class="hero-inner">
    <p class="eyebrow" id="heroEyebrow"></p>
    <h1 id="heroName"></h1>
    <p class="hero-role" id="heroRole"></p>
    <button class="play-btn" id="reelBtn"><span class="play-ico"></span>Watch showreel</button>
  </div>
  <div class="scroll-cue">Scroll</div>
</section>

<section class="work" id="work">
  <div class="section-head reveal"><h2>Selected work</h2><div class="filters" id="filters"></div></div>
  <div class="grid" id="grid"></div>
</section>

<section class="about" id="about">
  <h2 class="reveal">About</h2>
  <div class="about-cols">
    <p class="about-text reveal" id="aboutText"></p>
    <div class="reveal">
      <h3>Services</h3><ul id="services"></ul>
      <h3>Tools</h3><ul class="tags" id="tools"></ul>
    </div>
  </div>
</section>

<section class="contact" id="contact">
  <p class="eyebrow reveal">Let's work together</p>
  <a class="mail reveal" id="mail"></a>
  <div class="socials reveal" id="socials"></div>
</section>

<footer><span id="copy"></span><a href="#top">Back to top ↑</a></footer>

<div class="modal" id="modal" aria-hidden="true">
  <button class="close" id="close" aria-label="Close">×</button>
  <div class="modal-box">
    <div class="player" id="player"></div>
    <div class="modal-info" id="modalInfo"></div>
  </div>
</div>

<script>
/* =====================================================================
   ✏️  РЕДАКТИРУЙ ТОЛЬКО ЭТОТ БЛОК — всё остальное соберётся само
   ---------------------------------------------------------------------
   Видео (поле video / showreel):
     { type: "youtube", src: "https://youtu.be/XXXXXXXXXXX" }
     { type: "vimeo",   src: "https://vimeo.com/123456789" }
     { type: "mp4",     src: "videos/project1.mp4" }      // файл в репозитории
   preview — короткий беззвучный луп (3–6 сек, .mp4), играет при наведении
   thumb   — картинка-обложка (jpg/webp). Если нет ни thumb, ни preview,
             будет цветная анимированная заглушка (hue = цвет 0–360).
   wide: true — карточка на всю ширину
   ===================================================================== */
const CONFIG = {
  name: "Your Name",
  role: "3D & Motion Designer crafting product visuals, kinetic type and brand animation.",
  location: "Tallinn, Estonia",
  email: "hello@yourname.com",
  showreel: { type: "youtube", src: "" },     // ссылка на шоурил
  heroLoop: "",                               // напр. "videos/hero-loop.mp4" — фон первого экрана
  about: "I'm a 3D and motion designer based in Estonia. I build product animations, kinetic typography and visuals for brands — from concept and modelling to lighting, animation and final compositing.",
  services: ["3D product visualization", "Motion design & animation", "Kinetic typography", "Compositing & post-production"],
  tools: ["Cinema 4D", "After Effects", "Illustrator", "Photoshop", "Redshift", "Premiere Pro"],
  socials: [
    { label: "Behance",   url: "https://behance.net/" },
    { label: "Instagram", url: "https://instagram.com/" },
    { label: "YouTube",   url: "https://youtube.com/" },
    { label: "LinkedIn",  url: "https://linkedin.com/" }
  ]
};

const PROJECTS = [
  { title: "Wireless Earbuds Launch", category: "3D Product", year: "2026", client: "Brand name",
    description: "Product launch film: modelling, look-dev, lighting and animation.",
    thumb: "", preview: "", video: { type: "youtube", src: "" }, hue: 255, wide: true },
  { title: "Kinetic Type Series", category: "Motion Design", year: "2026", client: "Personal",
    description: "A set of typographic animations exploring rhythm and motion.",
    thumb: "", preview: "", video: { type: "vimeo", src: "" }, hue: 200 },
  { title: "Perfume Bottle Spot", category: "3D Product", year: "2025", client: "Brand name",
    description: "Liquid simulation and glass rendering for a 15s social spot.",
    thumb: "", preview: "", video: { type: "mp4", src: "" }, hue: 320 },
  { title: "Logo Reveal Pack", category: "Motion Design", year: "2025", client: "Studio",
    description: "Five logo animations for social media and presentations.",
    thumb: "", preview: "", video: { type: "youtube", src: "" }, hue: 30 },
  { title: "Abstract Loops", category: "Experiments", year: "2025", client: "Personal",
    description: "Seamless abstract loops made in Cinema 4D.",
    thumb: "", preview: "", video: { type: "youtube", src: "" }, hue: 160 },
  { title: "Sneaker Explode View", category: "3D Product", year: "2024", client: "Brand name",
    description: "Exploded-view animation showing product construction.",
    thumb: "", preview: "", video: { type: "youtube", src: "" }, hue: 90 }
];
/* ======================= конец блока настроек ======================== */

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function embed(v){
  if (!v || !v.src) return `<div class="empty">Add a video link for this project in PROJECTS</div>`;
  const src = v.src.trim();
  if (v.type === "youtube"){
    const m = src.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);
    const id = m ? m[1] : src;
    return `<iframe src="https://www.youtube.com/embed/${esc(id)}?autoplay=1&rel=0&modestbranding=1" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
  }
  if (v.type === "vimeo"){
    const m = src.match(/vimeo\.com\/(?:video\/)?(\d+)/);
    const id = m ? m[1] : src;
    return `<iframe src="https://player.vimeo.com/video/${esc(id)}?autoplay=1" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
  }
  return `<video src="${esc(src)}" controls autoplay playsinline></video>`;
}

/* --- fill static text --- */
document.title = `${CONFIG.name} — 3D & Motion Designer`;
$("#logo").textContent = CONFIG.name;
$("#heroEyebrow").textContent = `Portfolio · ${CONFIG.location}`;
$("#heroName").textContent = CONFIG.name;
$("#heroRole").textContent = CONFIG.role;
$("#aboutText").textContent = CONFIG.about;
$("#services").innerHTML = CONFIG.services.map(s => `<li>${esc(s)}</li>`).join("");
$("#tools").innerHTML = CONFIG.tools.map(s => `<li>${esc(s)}</li>`).join("");
$("#mail").textContent = CONFIG.email;
$("#mail").href = `mailto:${CONFIG.email}`;
$("#socials").innerHTML = CONFIG.socials.map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)} ↗</a>`).join("");
$("#copy").textContent = `© ${new Date().getFullYear()} ${CONFIG.name}`;
if (CONFIG.heroLoop){
  $("#heroBg").insertAdjacentHTML("afterbegin", `<video src="${esc(CONFIG.heroLoop)}" autoplay muted loop playsinline></video>`);
  document.querySelectorAll(".blob").forEach(b => b.remove());
}

/* --- grid --- */
$("#grid").innerHTML = PROJECTS.map((p, i) => {
  const ph = !p.thumb && !p.preview;
  return `<article class="card reveal${p.wide ? " wide" : ""}" data-i="${i}" data-cat="${esc(p.category)}" style="--h:${p.hue ?? (i * 57) % 360}">
    <div class="media${ph ? " ph" : ""}">
      ${p.thumb ? `<img src="${esc(p.thumb)}" alt="${esc(p.title)}" loading="lazy">` : ""}
      ${p.preview ? `<video src="${esc(p.preview)}" muted loop playsinline preload="none"></video>` : ""}
      ${ph ? `<span class="num">${String(i + 1).padStart(2, "0")}</span>` : ""}
      <span class="play-mini"></span>
    </div>
    <div class="meta"><h3>${esc(p.title)}</h3><span>${esc(p.category)} · ${esc(p.year)}</span></div>
  </article>`;
}).join("");

/* --- filters --- */
const cats = ["All", ...new Set(PROJECTS.map(p => p.category))];
$("#filters").innerHTML = cats.map((c, i) => `<button class="chip${i ? "" : " on"}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
$("#filters").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll(".card").forEach(c => c.classList.toggle("hide", b.dataset.c !== "All" && c.dataset.cat !== b.dataset.c));
});

/* --- hover previews (desktop) / in-view previews (touch) --- */
const canHover = matchMedia("(hover:hover)").matches;
const play = c => { const v = c.querySelector("video"); if (v){ v.play().catch(()=>{}); c.classList.add("playing"); } };
const stop = c => { const v = c.querySelector("video"); if (v){ v.pause(); c.classList.remove("playing"); } };
document.querySelectorAll(".card").forEach(c => {
  if (canHover){ c.addEventListener("mouseenter", () => play(c)); c.addEventListener("mouseleave", () => stop(c)); }
  c.addEventListener("click", () => openModal(PROJECTS[c.dataset.i]));
});
if (!canHover){
  const io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting ? play(e.target) : stop(e.target)), { threshold: .6 });
  document.querySelectorAll(".card").forEach(c => io.observe(c));
}

/* --- modal --- */
const modal = $("#modal");
function openModal(p){
  $("#player").innerHTML = embed(p.video);
  $("#modalInfo").innerHTML = p.title === "__reel" ? "" :
    `<div><h3>${esc(p.title)}</h3><p>${esc(p.description)}</p></div>
     <dl><dt>Client</dt><dd>${esc(p.client)}</dd><dt>Year</dt><dd>${esc(p.year)}</dd><dt>Type</dt><dd>${esc(p.category)}</dd></dl>`;
  modal.classList.add("open"); modal.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  modal.classList.remove("open"); modal.setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";
  setTimeout(() => $("#player").innerHTML = "", 300);
}
$("#reelBtn").addEventListener("click", () => openModal({ title: "__reel", video: CONFIG.showreel }));
$("#close").addEventListener("click", closeModal);
modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });
addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

/* --- reveal on scroll --- */
const ro = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add("in"); ro.unobserve(e.target); } }), { threshold: .12 });
document.querySelectorAll(".reveal").forEach(el => ro.observe(el));
</script>
</body>
</html>
