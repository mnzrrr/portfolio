<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>German Virre — 3D & Motion Designer</title>
<meta name="description" content="3D & Motion Design portfolio of German Virre">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0d; --bg2:#121215; --fg:#f2f2ee; --muted:#8b8b93; --line:#24242a;
    --accent:#c8ff3d; --radius:18px; --pad:clamp(16px,4vw,56px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--fg);font-family:Manrope,system-ui,sans-serif;font-size:17px;line-height:1.6;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  h1,h2,h3{font-family:Unbounded,sans-serif;font-weight:600;line-height:1.05;letter-spacing:-.02em}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

  /* NAV */
  .nav{position:fixed;inset:0 0 auto;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:18px var(--pad);mix-blend-mode:difference}
  .logo{font-family:Unbounded;font-weight:800;font-size:15px;letter-spacing:.02em}
  .nav nav{display:flex;gap:clamp(14px,3vw,32px);font-size:14px}
  .nav nav a{opacity:.8;transition:opacity .2s}
  .nav nav a:hover{opacity:1}

  /* HERO */
  .hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;padding:120px var(--pad) clamp(48px,8vw,96px);overflow:hidden}
  .hero-bg{position:absolute;inset:0;z-index:0;overflow:hidden}
  .hero-bg video{width:100%;height:100%;object-fit:cover;opacity:.5}
  .hero-bg iframe{position:absolute;top:50%;left:50%;width:max(100vw,177.78svh);height:max(56.25vw,100svh);transform:translate(-50%,-50%);border:0;pointer-events:none;opacity:.5}
  .hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,13,.25) 0%,rgba(11,11,13,.4) 50%,var(--bg) 100%)}
  .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:float 14s ease-in-out infinite alternate}
  .b1{width:46vw;height:46vw;background:#5b3cff;top:-10%;left:-8%}
  .b2{width:38vw;height:38vw;background:#00c2ff;top:20%;right:-10%;animation-delay:-4s}
  .b3{width:30vw;height:30vw;background:var(--accent);bottom:-5%;left:35%;opacity:.25;animation-delay:-8s}
  @keyframes float{to{transform:translate(6vw,4vh) scale(1.15)}}
  .hero-inner{position:relative;z-index:1;max-width:1200px}
  .eyebrow{font-size:13px;text-transform:uppercase;letter-spacing:.18em;color:var(--muted);margin-bottom:18px}
  .hero h1{font-size:clamp(44px,10vw,148px);font-weight:800;margin-bottom:20px}
  .hero-role{font-size:clamp(18px,2.2vw,26px);color:#cfcfd4;max-width:640px;margin-bottom:36px}
  .play-btn{display:inline-flex;align-items:center;gap:14px;padding:14px 26px 14px 14px;border-radius:999px;background:var(--fg);color:var(--bg);font-weight:700;transition:transform .25s,background .25s}
  .play-btn:hover{transform:scale(1.04);background:var(--accent)}
  .play-ico{width:38px;height:38px;border-radius:50%;background:var(--bg);position:relative;flex:none}
  .play-ico::after{content:"";position:absolute;left:15px;top:12px;border-left:12px solid var(--fg);border-top:7px solid transparent;border-bottom:7px solid transparent}
  .scroll-cue{position:absolute;right:var(--pad);bottom:clamp(48px,8vw,96px);z-index:1;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);writing-mode:vertical-rl}

  /* WORK */
  section{padding:clamp(64px,10vw,140px) var(--pad)}
  .section-head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:20px;margin-bottom:40px}
  h2{font-size:clamp(32px,5vw,64px)}
  .filters{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:8px 16px;border:1px solid var(--line);border-radius:999px;font-size:14px;color:var(--muted);transition:all .2s}
  .chip:hover{color:var(--fg);border-color:#444}
  .chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(14px,2vw,28px)}
  .card{cursor:pointer}
  .card.wide{grid-column:span 2}
  .card.hide{display:none}
  .media{position:relative;aspect-ratio:16/10;border-radius:var(--radius);overflow:hidden;background:var(--bg2)}
  .card.wide .media{aspect-ratio:21/9}
  .media img,.media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.2,.7,.2,1),opacity .5s}
  .card:hover .media img{transform:scale(1.04)}
  .media .thumb{opacity:0}
  .media .thumb.loaded{opacity:1}
  .media .hover-vid{position:absolute;top:50%;left:50%;width:max(100%,calc(var(--ch,100cqh) * 1.7778));aspect-ratio:16/9;transform:translate(-50%,-50%);border:0;pointer-events:none;opacity:0;transition:opacity .6s}
  .media .hover-vid.ready{opacity:1}
  .media{container-type:size}
  .media.ph{background:
      radial-gradient(circle at 25% 30%,hsl(var(--h) 90% 60% / .9),transparent 50%),
      radial-gradient(circle at 75% 70%,hsl(calc(var(--h) + 70) 90% 55% / .8),transparent 50%),
      #141418;background-size:180% 180%;animation:drift 12s ease-in-out infinite alternate}
  @keyframes drift{to{background-position:100% 100%}}
  .play-mini{position:absolute;top:16px;right:16px;z-index:3;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.14);backdrop-filter:blur(10px);opacity:0;transform:scale(.8);transition:all .3s}
  .play-mini::after{content:"";position:absolute;left:18px;top:15px;border-left:12px solid #fff;border-top:8px solid transparent;border-bottom:8px solid transparent}
  .card:hover .play-mini{opacity:1;transform:scale(1)}
  .meta{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:16px 4px 0}
  .meta h3{font-size:clamp(16px,1.6vw,20px);font-weight:600}
  .meta span{font-size:14px;color:var(--muted);white-space:nowrap}

  /* GALLERY (card + modal) */
  .gallery .slide{opacity:0;transition:opacity .5s,transform .7s cubic-bezier(.2,.7,.2,1)}
  .gallery .slide.on{opacity:1}
  .arr{position:absolute;top:50%;z-index:3;width:46px;height:46px;margin-top:-23px;border-radius:50%;background:rgba(10,10,12,.45);backdrop-filter:blur(10px);display:grid;place-items:center;transition:background .2s,opacity .3s,transform .2s}
  .arr:hover{background:rgba(10,10,12,.75);transform:scale(1.08)}
  .arr svg{width:20px;height:20px;stroke:#fff;stroke-width:2.2;fill:none}
  .arr.prev{left:14px}.arr.next{right:14px}
  .dots{position:absolute;left:50%;bottom:14px;z-index:3;transform:translateX(-50%);display:flex;gap:6px}
  .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4);transition:all .3s}
  .dots i.on{background:#fff;width:20px;border-radius:4px}
  .count{position:absolute;top:16px;left:16px;z-index:3;font-size:12px;letter-spacing:.08em;padding:4px 10px;border-radius:999px;background:rgba(10,10,12,.45);backdrop-filter:blur(10px)}
  @media (hover:hover){
    .card .arr{opacity:0}
    .card:hover .arr{opacity:1}
  }

  /* ABOUT */
  .about{border-top:1px solid var(--line)}
  .about-cols{display:grid;grid-template-columns:1.4fr 1fr;gap:clamp(32px,6vw,96px);margin-top:40px}
  .about-text{font-size:clamp(20px,2.2vw,28px);line-height:1.45;color:#dcdce0}
  .about h3{font-family:Manrope;font-size:13px;text-transform:uppercase;letter-spacing:.18em;color:var(--muted);margin:0 0 14px;font-weight:700}
  .about ul{list-style:none;margin-bottom:36px}
  .about li{padding:10px 0;border-bottom:1px solid var(--line)}
  .tags{display:flex;flex-wrap:wrap;gap:8px}
  .tags li{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px}

  /* CONTACT */
  .contact{border-top:1px solid var(--line);text-align:left}
  .mail{display:inline-block;font-family:Unbounded;font-weight:800;font-size:clamp(24px,6vw,92px);line-height:1.05;letter-spacing:-.03em;word-break:break-all;background:linear-gradient(90deg,var(--fg) 50%,var(--accent) 50%) right/200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;transition:background-position .6s}
  .mail:hover{background-position:left}
  .socials{display:flex;flex-wrap:wrap;gap:12px 28px;margin-top:40px}
  .socials a{color:var(--muted);border-bottom:1px solid transparent;transition:all .2s}
  .socials a:hover{color:var(--fg);border-color:var(--fg)}
  footer{padding:28px var(--pad);border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

  /* MODAL */
  .modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:var(--pad);background:rgba(5,5,7,.9);backdrop-filter:blur(14px);opacity:0;pointer-events:none;transition:opacity .3s}
  .modal.open{opacity:1;pointer-events:auto}
  .modal-box{width:min(1200px,100%);max-height:100%;overflow:auto;transform:translateY(20px);transition:transform .35s}
  .modal.open .modal-box{transform:none}
  .player{position:relative;aspect-ratio:16/9;max-height:80vh;margin:0 auto;border-radius:var(--radius);overflow:hidden;background:#000}
  .player.square{aspect-ratio:1/1;width:min(100%,80vh)}
  .player.vertical{aspect-ratio:9/16;width:min(100%,45vh)}
  .card.vertical .media .hover-vid{width:100%;aspect-ratio:9/16}
  .player iframe,.player video,.player img{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:contain}
  .player .empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);text-align:center;padding:20px}
  .modal-info{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;padding-top:20px}
  .modal-info h3{font-size:clamp(20px,2.4vw,30px)}
  .modal-info p{color:#bdbdc3;max-width:620px;margin-top:8px}
  .modal-info dl{display:grid;grid-template-columns:auto auto;gap:4px 18px;font-size:14px;align-content:start;max-width:360px}
  .modal-info dt{color:var(--muted)}
  .close{position:fixed;top:16px;right:16px;z-index:5;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.1);font-size:26px;line-height:1}
  .close:hover{background:rgba(255,255,255,.2)}

  /* REVEAL */
  .reveal{opacity:0;transform:translateY(30px);transition:opacity .8s,transform .8s cubic-bezier(.2,.7,.2,1)}
  .reveal.in{opacity:1;transform:none}

  @media (max-width:760px){
    .grid{grid-template-columns:1fr}
    .card.wide{grid-column:auto}
    .card.wide .media{aspect-ratio:16/10}
    .about-cols{grid-template-columns:1fr}
    .scroll-cue{display:none}
    .nav nav{gap:14px}
    .arr{width:40px;height:40px;margin-top:-20px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="nav">
  <a class="logo" href="#top" id="logo"></a>
  <nav><a href="#work">Work</a><a href="#about">About</a><a href="#contact">Contact</a></nav>
</header>

<section class="hero" id="top">
  <div class="hero-bg" id="heroBg"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>
  <div class="hero-inner">
    <p class="eyebrow" id="heroEyebrow"></p>
    <h1 id="heroName"></h1>
    <p class="hero-role" id="heroRole"></p>
    <button class="play-btn" id="reelBtn"><span class="play-ico"></span><span id="reelLabel"></span></button>
  </div>
  <div class="scroll-cue">Scroll</div>
</section>

<section class="work" id="work">
  <div class="section-head reveal"><h2>Selected work</h2><div class="filters" id="filters"></div></div>
  <div class="grid" id="grid"></div>
</section>

<section class="about" id="about">
  <h2 class="reveal">About</h2>
  <div class="about-cols">
    <p class="about-text reveal" id="aboutText"></p>
    <div class="reveal">
      <h3>Services</h3><ul id="services"></ul>
      <h3>Tools</h3><ul class="tags" id="tools"></ul>
    </div>
  </div>
</section>

<section class="contact" id="contact">
  <p class="eyebrow reveal">Let's work together</p>
  <a class="mail reveal" id="mail"></a>
  <div class="socials reveal" id="socials"></div>
</section>

<footer><span id="copy"></span><a href="#top">Back to top ↑</a></footer>

<div class="modal" id="modal" aria-hidden="true">
  <button class="close" id="close" aria-label="Close">×</button>
  <div class="modal-box">
    <div class="player" id="player"></div>
    <div class="modal-info" id="modalInfo"></div>
  </div>
</div>

<script>
/* =====================================================================
   ✏️  РЕДАКТИРУЙ ТОЛЬКО ЭТОТ БЛОК — всё остальное соберётся само
   ---------------------------------------------------------------------
   video:  { type: "vimeo",   src: "https://vimeo.com/123456789" }
           { type: "youtube", src: "https://youtu.be/XXXXXXXXXXX" }
           { type: "mp4",     src: "assets/video/file.mp4" }
   images: ["assets/img/a.jpg", "assets/img/b.jpg"]  — галерея со стрелками
   thumb:  обложка карточки (для Vimeo подтягивается сама, если пусто)
   wide: true — карточка на всю ширину
   ===================================================================== */
const CONFIG = {
  name: "German Virre",
  role: "3D & Motion Designer crafting product visuals, kinetic type and brand animation.",
  location: "Estonia",
  email: "mnzrmotion@gmail.com",
  showreel: { type: "vimeo", src: "https://vimeo.com/1174177238" },   // кнопка на первом экране
  reelLabel: "Watch latest work",                                     // текст кнопки
  heroLoop: { type: "vimeo", src: "https://vimeo.com/1174177238" },   // фон первого экрана (vimeo или mp4)
  about: "I'm a 3D and motion designer based in Estonia. I build product animations, kinetic typography and visuals for brands — from concept and modelling to lighting, animation and final compositing.",
  services: ["3D product visualization", "Motion design & animation", "Kinetic typography", "Compositing & post-production"],
  tools: ["Cinema 4D", "After Effects", "Illustrator", "Photoshop", "Redshift", "Premiere Pro"],
  socials: [
    { label: "Behance",   url: "https://www.behance.net/mnzrrr" },
    { label: "Instagram", url: "https://www.instagram.com/minzvr/" },
    { label: "Telegram",  url: "https://t.me/morgguee" }
  ]
};

const PROJECTS = [
  { title: "Alabaster Watch Concept", category: "3D Product",
    description: "",
    video: { type: "vimeo", src: "https://vimeo.com/1174177238" }, wide: true },
  { title: "Motion for Revuelt Core", category: "Motion Design",
    description: "",
    video: { type: "vimeo", src: "https://vimeo.com/1237762770" } },
  { title: "Perfume Product Render", category: "Product Stills",
    description: "",
    images: ["assets/img/perfume-1.jpg", "assets/img/perfume-2.jpg"], square: true },
  { title: "FIFA World Cup 2026", category: "3D Animation",
    description: "A small 3D animation in honor of the FIFA World Cup.",
    video: { type: "vimeo", src: "https://vimeo.com/1237770645" }, vertical: true },
  { title: "FIFA 2026 Trionda Ball Loop", category: "3D Animation",
    description: "A small 3D animation dedicated to the FIFA World Cup.",
    video: { type: "vimeo", src: "https://vimeo.com/1237770995" }, vertical: true }
];
/* ======================= конец блока настроек ======================== */

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ARR = d => `<svg viewBox="0 0 24 24"><path d="${d === "prev" ? "M15 5l-7 7 7 7" : "M9 5l7 7-7 7"}"/></svg>`;
const vimeoId = src => (String(src).match(/vimeo\.com\/(?:video\/)?(\d+)/) || [])[1];
const ytId = src => (String(src).match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/) || [])[1];

function embed(v){
  if (!v || !v.src) return `<div class="empty">Add a video link for this project in PROJECTS</div>`;
  const src = v.src.trim();
  if (v.type === "youtube") return `<iframe src="https://www.youtube.com/embed/${esc(ytId(src) || src)}?autoplay=1&rel=0&modestbranding=1" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
  if (v.type === "vimeo") return `<iframe src="https://player.vimeo.com/video/${esc(vimeoId(src) || src)}?autoplay=1&title=0&byline=0&portrait=0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
  return `<video src="${esc(src)}" controls autoplay playsinline></video>`;
}
const vimeoBg = id => `https://player.vimeo.com/video/${id}?background=1&muted=1&autoplay=1&loop=1&dnt=1`;

/* --- gallery helper: slides + arrows + dots + swipe --- */
function gallery(root, images, start = 0, alt = ""){
  root.classList.add("gallery");
  root.insertAdjacentHTML("beforeend",
    images.map((src, i) => `<img class="slide${i === start ? " on" : ""}" src="${esc(src)}" alt="${esc(alt)} ${i + 1}" ${i ? 'loading="lazy"' : ""}>`).join("") +
    (images.length > 1 ? `<button class="arr prev" aria-label="Previous">${ARR("prev")}</button><button class="arr next" aria-label="Next">${ARR("next")}</button>
     <span class="count"></span><div class="dots">${images.map(() => "<i></i>").join("")}</div>` : ""));
  let idx = start;
  const slides = root.querySelectorAll(".slide"), dots = root.querySelectorAll(".dots i"), count = root.querySelector(".count");
  const go = n => {
    idx = (n + images.length) % images.length;
    slides.forEach((s, i) => s.classList.toggle("on", i === idx));
    dots.forEach((d, i) => d.classList.toggle("on", i === idx));
    if (count) count.textContent = `${idx + 1} / ${images.length}`;
  };
  go(start);
  root.querySelector(".prev")?.addEventListener("click", e => { e.stopPropagation(); go(idx - 1); });
  root.querySelector(".next")?.addEventListener("click", e => { e.stopPropagation(); go(idx + 1); });
  let x0 = null;
  root.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
  root.addEventListener("touchend", e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 40){ root.dataset.swiped = "1"; go(idx + (dx < 0 ? 1 : -1)); setTimeout(() => delete root.dataset.swiped, 50); }
  });
  return { go, get index(){ return idx; } };
}

/* --- fill static text --- */
document.title = `${CONFIG.name} — 3D & Motion Designer`;
$("#logo").textContent = CONFIG.name;
$("#heroEyebrow").textContent = `Portfolio · ${CONFIG.location}`;
$("#heroName").textContent = CONFIG.name;
$("#heroRole").textContent = CONFIG.role;
$("#reelLabel").textContent = CONFIG.reelLabel || "Watch showreel";
$("#aboutText").textContent = CONFIG.about;
$("#services").innerHTML = CONFIG.services.map(s => `<li>${esc(s)}</li>`).join("");
$("#tools").innerHTML = CONFIG.tools.map(s => `<li>${esc(s)}</li>`).join("");
$("#mail").textContent = CONFIG.email;
$("#mail").href = `mailto:${CONFIG.email}`;
$("#socials").innerHTML = CONFIG.socials.map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)} ↗</a>`).join("");
$("#copy").textContent = `© ${new Date().getFullYear()} ${CONFIG.name}`;

const hl = CONFIG.heroLoop;
if (hl && hl.src){
  const id = hl.type === "vimeo" && vimeoId(hl.src);
  $("#heroBg").insertAdjacentHTML("afterbegin", id
    ? `<iframe src="${vimeoBg(id)}" allow="autoplay" tabindex="-1" title="Background video"></iframe>`
    : `<video src="${esc(hl.src)}" autoplay muted loop playsinline></video>`);
}

/* --- grid --- */
const grid = $("#grid");
const galleries = [];
PROJECTS.forEach((p, i) => {
  const card = document.createElement("article");
  card.className = `card reveal${p.wide ? " wide" : ""}${p.vertical ? " vertical" : ""}`;
  card.dataset.cat = p.category;
  card.style.setProperty("--h", p.hue ?? (i * 97 + 220) % 360);
  const meta = [p.category, p.year].filter(Boolean).map(esc).join(" · ");
  card.innerHTML = `<div class="media"></div><div class="meta"><h3>${esc(p.title)}</h3><span>${meta}</span></div>`;
  const media = card.querySelector(".media");

  if (p.images && p.images.length){
    galleries[i] = gallery(media, p.images, 0, p.title);
  } else {
    media.classList.add("ph");
    media.insertAdjacentHTML("beforeend", `<span class="play-mini"></span>`);
    const vid = p.video && p.video.type === "vimeo" && vimeoId(p.video.src);
    const setThumb = url => {
      const img = new Image();
      img.className = "thumb"; img.alt = p.title; img.loading = "lazy";
      img.onload = () => { img.classList.add("loaded"); media.classList.remove("ph"); };
      img.src = url;
      media.prepend(img);
    };
    if (p.thumb) setThumb(p.thumb);
    else if (vid){
      fetch(`https://vimeo.com/api/oembed.json?url=${encodeURIComponent("https://vimeo.com/" + vid)}&width=1920`)
        .then(r => r.ok ? r.json() : null)
        .then(d => { if (d && d.thumbnail_url) setThumb(d.thumbnail_url.replace(/_\d+x\d+/, "_1920")); })
        .catch(() => {});
    } else if (p.video && p.video.type === "youtube" && ytId(p.video.src)){
      setThumb(`https://i.ytimg.com/vi/${ytId(p.video.src)}/maxresdefault.jpg`);
    }
    // hover preview (desktop only)
    if (vid && matchMedia("(hover:hover)").matches){
      let t;
      card.addEventListener("mouseenter", () => {
        t = setTimeout(() => {
          if (media.querySelector(".hover-vid")) return;
          const f = document.createElement("iframe");
          f.className = "hover-vid"; f.allow = "autoplay"; f.tabIndex = -1; f.title = "";
          f.src = vimeoBg(vid);
          f.onload = () => setTimeout(() => f.classList.add("ready"), 600);
          media.appendChild(f);
        }, 250);
      });
      card.addEventListener("mouseleave", () => { clearTimeout(t); media.querySelector(".hover-vid")?.remove(); });
    }
  }
  card.addEventListener("click", () => {
    if (media.dataset.swiped) return;
    openModal(p, galleries[i] ? galleries[i].index : 0);
  });
  grid.appendChild(card);
});

/* --- filters (hidden if only one category) --- */
const cats = ["All", ...new Set(PROJECTS.map(p => p.category))];
if (cats.length > 2){
  $("#filters").innerHTML = cats.map((c, i) => `<button class="chip${i ? "" : " on"}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
  $("#filters").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === b));
    document.querySelectorAll(".card").forEach(c => c.classList.toggle("hide", b.dataset.c !== "All" && c.dataset.cat !== b.dataset.c));
  });
}

/* --- modal --- */
const modal = $("#modal"), player = $("#player");
let modalGallery = null;
function openModal(p, start = 0){
  player.innerHTML = ""; player.className = "player"; modalGallery = null;
  if (p.images && p.images.length){
    if (p.square) player.classList.add("square");
    modalGallery = gallery(player, p.images, start, p.title);
  } else {
    if (p.vertical) player.classList.add("vertical");
    player.innerHTML = embed(p.video);
  }
  if (p.title === "__reel"){ $("#modalInfo").innerHTML = ""; }
  else {
    const rows = [["Client", p.client], ["Year", p.year], ["Apps", p.apps], ["Type", p.category]]
      .filter(r => r[1]).map(r => `<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join("");
    $("#modalInfo").innerHTML = `<div><h3>${esc(p.title)}</h3>${p.description ? `<p>${esc(p.description)}</p>` : ""}</div><dl>${rows}</dl>`;
  }
  modal.classList.add("open"); modal.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  modal.classList.remove("open"); modal.setAttribute("aria-hidden", "true");
  document.body.style.overflow = ""; modalGallery = null;
  setTimeout(() => { if (!modal.classList.contains("open")) player.innerHTML = ""; }, 300);
}
$("#reelBtn").addEventListener("click", () => openModal({ title: "__reel", video: CONFIG.showreel }));
$("#close").addEventListener("click", closeModal);
modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });
addEventListener("keydown", e => {
  if (!modal.classList.contains("open")) return;
  if (e.key === "Escape") closeModal();
  if (modalGallery && e.key === "ArrowRight") modalGallery.go(modalGallery.index + 1);
  if (modalGallery && e.key === "ArrowLeft") modalGallery.go(modalGallery.index - 1);
});

/* --- reveal on scroll --- */
const ro = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add("in"); ro.unobserve(e.target); } }), { threshold: .12 });
document.querySelectorAll(".reveal").forEach(el => ro.observe(el));
</script>
